[project]
name = "rag-core"
version = "0.1.0"
description = "Shared foundation for the Agentic RAG platform: config, models, AWS clients, stores, resilience, telemetry."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Logging
    "structlog>=24.1",
    "orjson>=3.10",
    # Resilience
    "tenacity>=8.4",
    # AWS (sync + async)
    "boto3>=1.34",
    "botocore>=1.34",
    "aioboto3>=13.0",
    # Use the OS trust store for TLS (works behind corporate MITM proxies).
    "truststore>=0.9",
    # Vector store
    "qdrant-client>=1.11",
    # Observability
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
