name: Auto Test Update

# Runs on every push to any branch. It:
#   1. figures out what source changed,
#   2. has a local Llama model (Ollama) write/update pytest tests,
#   3. verifies each generated test by RUNNING it (repairing up to 3 times),
#   4. opens a PR with the tests that pass,
#   5. e-mails a report (changes, tests, results, tokens + cost).
#
# WHY self-hosted: inference runs against Ollama on this machine, so GitHub's
# cloud runners cannot reach it. The runner must be registered on the same
# machine that has Ollama + the llama3.1:8b model. Cost is therefore $0.
#
# Loop safety: the PR is pushed with the built-in GITHUB_TOKEN, and GitHub does
# NOT re-trigger workflows for such pushes — so this never triggers itself. The
# branch guard below is a second safeguard.

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-test-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-tests:
    if: >-
      !startsWith(github.ref_name, 'auto-tests/') &&
      !contains(github.event.head_commit.message, '[skip-auto-test]')
    runs-on: [self-hosted, windows]

    env:
      # This network intercepts TLS, so uv's bundled roots reject PyPI with
      # "invalid peer certificate: UnknownIssuer". Use the Windows certificate
      # store instead, which already trusts the corporate root CA.
      UV_NATIVE_TLS: "true"

    defaults:
      run:
        # Windows PowerShell 5.1, not `pwsh` — PowerShell 7 is not installed on
        # this runner and `shell: pwsh` fails with "command not found".
        shell: powershell

    steps:
      - name: Checkout (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Ollama is up and the model is present
        # Only needed on the local-inference path. Skipped when using Bedrock.
        if: ${{ (vars.LLM_PROVIDER || 'bedrock') == 'ollama' }}
        run: |
          # -UseBasicParsing is required on Windows PowerShell 5.1; without it
          # Invoke-WebRequest tries the IE engine and throws NullReferenceException.
          function Test-Ollama {
            try {
              Invoke-WebRequest -Uri "$env:OLLAMA_HOST/api/tags" -TimeoutSec 5 -UseBasicParsing | Out-Null
              return $true
            } catch { return $false }
          }
          if (-not (Test-Ollama)) {
            Write-Host "Starting ollama serve..."
            Start-Process -FilePath "ollama" -ArgumentList "serve" -WindowStyle Hidden
            for ($i = 0; $i -lt 10; $i++) {
              Start-Sleep -Seconds 3
              if (Test-Ollama) { break }
            }
          }
          if (-not (Test-Ollama)) {
            Write-Error "Ollama is not reachable at $env:OLLAMA_HOST"
            exit 1
          }
          Write-Host "Ollama is up."
          $tags = (Invoke-WebRequest -Uri "$env:OLLAMA_HOST/api/tags" -UseBasicParsing).Content
          if ($tags -notmatch [regex]::Escape($env:OLLAMA_MODEL)) {
            Write-Host "Pulling $env:OLLAMA_MODEL ..."
            ollama pull $env:OLLAMA_MODEL
          } else {
            Write-Host "Model $env:OLLAMA_MODEL already present."
          }
        env:
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://localhost:11434' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.1:8b' }}

      - name: Install dependencies
        # --all-packages is required: the root pyproject is a workspace
        # aggregator with no dependencies, so a plain `uv sync` installs none of
        # the members and every test fails with ModuleNotFoundError: rag_core.
        run: uv sync --all-packages --group dev

      - name: Generate / update tests and run suite
        id: generate
        env:
          # Default to Bedrock Haiku: a local 8B model could not reliably write
          # correct assertions (measured ~50% of files ended up skipped).
          # Set the LLM_PROVIDER variable to 'ollama' to go back to free local
          # inference.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'bedrock' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_REGION: ${{ secrets.BEDROCK_REGION }}
          BEDROCK_LLM_MODEL: ${{ secrets.BEDROCK_LLM_MODEL }}
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://localhost:11434' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.1:8b' }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: uv run python scripts/ci/generate_tests.py

      - name: Open pull request with generated tests
        id: cpr
        if: steps.generate.outputs.wrote_tests == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-tests/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          commit-message: "test: auto-update tests for ${{ github.sha }} [skip-auto-test]"
          title: "Auto-generated test updates for ${{ github.ref_name }}"
          body: |
            Automated test updates generated from the changes in ${{ github.sha }}.

            Every test in this PR was verified by actually running it before being
            committed. See the e-mailed report for the full summary.
          add-paths: |
            packages/**/tests/**
            services/**/tests/**

      - name: Send e-mail report
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: uv run python scripts/ci/send_report.py

      - name: Upload report artifact
        # Nice-to-have only — the report is delivered by e-mail. Never fail the
        # run over it (artifact upload is the first thing to break behind a
        # TLS-intercepting proxy).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci_report.json
          if-no-files-found: ignore
