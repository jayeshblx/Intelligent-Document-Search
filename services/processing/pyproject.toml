[project]
name = "rag-processing"
version = "0.1.0"
description = "Document Processing Agent — text/OCR/tables/layout extraction into ExtractedContent."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "rag-core",
    "fastapi>=0.114",
    "uvicorn[standard]>=0.30",
    # Document parsers (pure-python or wheel-backed; no system binaries required).
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",  # fast PDF text/Markdown + page rasterisation for OCR
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "lxml>=5.2",
    "langdetect>=1.0.9",
    "Pillow>=10.3",
    "pytesseract>=0.3.10",  # local Tesseract OCR for scanned PDFs (needs the tesseract binary)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_processing"]

[tool.uv.sources]
rag-core = { workspace = true }
