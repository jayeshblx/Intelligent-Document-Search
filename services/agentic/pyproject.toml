[project]
name = "rag-agentic"
version = "0.1.0"
description = "Agentic AI approach: an LLM-driven planner/tool loop over the existing retrieval stack."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "rag-core",
    "rag-search",
    "fastapi>=0.114",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agentic"]

[tool.uv.sources]
rag-core = { workspace = true }
rag-search = { workspace = true }
