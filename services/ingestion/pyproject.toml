[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Document Ingestion Service — S3 incremental sync, dedup, versioning, SQS emit."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "rag-core",
    "fastapi>=0.114",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[tool.uv.sources]
rag-core = { workspace = true }
